task: ISLR
data:
  input_data: videos
  input_streams:
  - keypoint
  - rgb
  keypoint_file: /mnt/workspace/projects/haojun/SLRT/data/phoenix_2014t/keypoints_hrnet_dark_coco_wholebody_iso.train.finite.pkl
  use_keypoints:
  - pose
  - mouth_half
  - hand
  zip_file: /mnt/workspace/projects/haojun/SLRT/data/phoenix_2014t/PHOENIX2014T_videos.zip
  train: /mnt/workspace/projects/haojun/SLRT/Online/CSLR/results/phoenix-2014t_ISLR/p7_temporal_grid_assets_v1/E_context24.train.pkl
  dev: /tmp/P7_DEV_ACCESS_FORBIDDEN
  test: /tmp/P7_TEST_ACCESS_FORBIDDEN
  vocab_file: /mnt/workspace/projects/haojun/SLRT/data/phoenix_2014t/phoenix_iso_with_blank.vocab
  dataset_name: phoenix_iso
  level: word
  txt_lowercase: true
  num_output_frames: 24
  max_sent_length: 400
  transform_cfg:
    bag_size: 6
    num_instance: 6
    img_size: 224
    color_jitter: true
    bottom_area: 0.7
    center_crop_size: 224
    center_crop: false
    randomcrop_threshold: 1
    aspect_ratio_min: 0.75
    aspect_ratio_max: 1.3
    temporal_augmentation:
      tmin: 0.5
      tmax: 1.5
    index_setting:
    - consecutive
    - pad
    - central
    - pad
  raw_vlens_split_overrides:
    dev: train
testing:
  cfg:
    recognition:
      beam_size: 1
training:
  overwrite: true
  model_dir: results/phoenix-2014t_ISLR
  random_seed: 321
  shuffle: true
  num_workers: 4
  batch_size: 16
  total_epoch: 100
  keep_last_ckpts: 1
  validation:
    unit: epoch
    freq: 1
    cfg:
      recognition:
        beam_size: 1
  optimization:
    optimizer: Adam
    learning_rate:
      default: 0.0006
    weight_decay: 0.001
    betas:
    - 0.9
    - 0.998
    scheduler: cosineannealing
    t_max: 100
model:
  RecognitionNetwork:
    GlossTokenizer:
      gloss2id_file: /mnt/workspace/projects/haojun/SLRT/pretrained_models/mBart_de_2/gloss2ids.pkl
    s3d:
      pretrained_ckpt: /mnt/workspace/projects/haojun/SLRT/pretrained_models/s3ds_actioncls_ckpt
      use_block: 5
      freeze_block: 0
    keypoint_s3d:
      in_channel: 0
      pretrained_ckpt: /mnt/workspace/projects/haojun/SLRT/pretrained_models/s3ds_actioncls_ckpt
      use_block: 5
      freeze_block: 0
    heatmap_cfg:
      raw_size:
      - 260
      - 210
      input_size: 112
      sigma: 8
    fuse_method: triplehead_cat_bilateral
    lateral:
      pose2rgb: true
      rgb2pose: true
      variant_pose2rgb: null
      variant_rgb2pose: null
      interpolate: false
      kernel_size:
      - 1
      - 3
      - 3
      fusion_features:
      - c1
      - c2
      - c3
      - c4
    pyramid:
      version: v1
      rgb: null
      pose: null
    aux_head:
      head_weight_rgb: 0.2
      head_weight_keypoint: 0.5
      num: 0
    visual_head:
      variant: sep_conv
      use_extra_linear: false
      input_size: 1024
      hidden_size: 512
      ff_size: 2048
      pe: true
      ff_kernelsize:
      - 3
      - 3
      word_emb_dim: 300
      temp: 0.1
      contras_setting: null
      topk: 1115
      split_setting: split_nonblk
    label_smooth: 0.2
    bag_loss:
    - avg_prob
    - avg_prob
